<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gateway Authorization Terminal</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #040508; color: #00ffaa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #0a0d16; padding: 40px; border-radius: 8px; border: 1px solid #00ffaa; box-shadow: 0 0 25px rgba(0,255,170,0.2); width: 340px; text-align: left; }
        h2 { margin-top: 0; font-size: 16px; letter-spacing: 1px; border-bottom: 1px solid #1a2238; padding-bottom: 10px; color: #fff; }
        .input-group { margin-bottom: 18px; }
        label { display: block; font-size: 11px; color: #888; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 10px; background: #111524; border: 1px solid #1a2238; color: #fff; font-family: inherit; font-size: 13px; border-radius: 4px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00ffaa; }
        button { width: 100%; padding: 12px; background: #00ffaa; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-family: inherit; margin-top: 10px; }
        button:hover { background: #00cc88; box-shadow: 0 0 10px #00ffaa; }
        .error-msg { color: #ff3333; font-size: 11px; margin-bottom: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 ACCESS AUTHORIZATION CORE</h2>
        {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
        <form action="/login" method="POST">
            <div class="input-group"><label>User Identity Address</label><input type="text" name="username" required autocomplete="off"></div>
            <div class="input-group"><label>Passkey Cipher Vector</label><input type="password" name="password" required></div>
            <button type="submit">DECRYPT & ENTER STATION</button>
        </form>
    </div>
</body>
</html>
